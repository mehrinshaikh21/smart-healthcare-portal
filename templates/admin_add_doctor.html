<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Doctor</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/admin_add_doctor.css') }}">

</head>

<body>

    <div class="container">

        <div class="header">

            <div>

                <h1>➕ Add Doctor</h1>

                <p>
                    Register a new doctor in the Smart Healthcare Portal
                </p>

            </div>

            <a href="/admin-doctors" class="back-btn">
                ← Doctors
            </a>

        </div>


        <div class="form-box">

            <form action="/admin-add-doctor" method="POST">


                <!-- Doctor Name -->

                <div class="form-group">

                    <label for="full_name">
                        👨‍⚕️ Doctor Name
                    </label>

                    <input
                        type="text"
                        id="full_name"
                        name="full_name"
                        placeholder="Enter doctor's full name"
                        required
                    >

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        📧 Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter doctor's email"
                        required
                    >

                </div>


                <!-- Mobile -->

                <div class="form-group">

                    <label for="mobile">
                        📱 Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="mobile"
                        name="mobile"
                        placeholder="Enter mobile number"
                        required
                    >

                </div>


                <!-- Specialization -->

                <div class="form-group">

                    <label for="specialization">
                        🩺 Specialization
                    </label>

                    <input
                        type="text"
                        id="specialization"
                        name="specialization"
                        placeholder="Example: Cardiologist"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        🔒 Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create doctor password"
                        required
                    >

                </div>


                <!-- Buttons -->

                <div class="form-actions">

                    <a href="/admin-doctors" class="cancel-btn">
                        Cancel
                    </a>

                    <button type="submit" class="save-btn">
                        💾 Add Doctor
                    </button>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
