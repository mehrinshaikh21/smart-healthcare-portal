<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Appointments</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/my_appointments.css') }}">
</head>

<body>

<div class="container">

    <div class="appointment-box">

        <h1>📋 My Appointments</h1>

        <p>Your booked appointments are shown below.</p>

        <table>

            <tr>
                <th>Doctor</th>
                <th>Department</th>
                <th>Date</th>
                <th>Time</th>
                <th>Status</th>
            </tr>

            {% for appointment in appointments %}

            <tr>

                <td>{{ appointment[2] }}</td>

                <td>{{ appointment[3] }}</td>

                <td>{{ appointment[4] }}</td>

                <td>{{ appointment[5] }}</td>

                <td>
                    <span class="status">
                        Pending
                    </span>
                </td>

            </tr>

            {% endfor %}

        </table>

        <div class="buttons">

            <a href="/patient-dashboard">
                <button>⬅ Back to Dashboard</button>
            </a>

        </div>

    </div>

</div>

</body>
</html>
