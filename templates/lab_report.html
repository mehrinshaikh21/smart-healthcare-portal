<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Enter Blood Test Report</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/lab_report.css') }}">

</head>

<body>

<div class="container">

    <!-- Header -->

    <div class="header">

        <div>

            <h1>🧪 Enter Blood Test Report</h1>

            <p>
                Healthcare Clinical Laboratory
            </p>

        </div>

        <a href="/lab-dashboard" class="back-btn">
            ← Dashboard
        </a>

    </div>


    <!-- Patient Information -->

    <div class="patient-box">

        <h2>👤 Patient Information</h2>

        <div class="info">

            <p>
                <strong>Patient:</strong>
                {{ request_data[1] }}
            </p>

            <p>
                <strong>Test:</strong>
                {{ request_data[2] }}
            </p>

            <p>
                <strong>Date:</strong>
                {{ request_data[4] }}
            </p>

            <p>
                <strong>Time:</strong>
                {{ request_data[5] }}
            </p>

            <p>
                <strong>Collection:</strong>
                {{ request_data[3] }}
            </p>

            <p>
                <strong>Status:</strong>
                {{ request_data[7] }}
            </p>

        </div>

    </div>


    <!-- Report Form -->

    <div class="form-box">

        <h2>📋 Test Report</h2>

        <form method="POST">

            <div class="form-group">

                <label for="result">
                    🧪 Test Result
                </label>

                <textarea
                    id="result"
                    name="result"
                    rows="4"
                    placeholder="Enter test result"
                    required
                ></textarea>

            </div>


            <div class="form-group">

                <label for="normal_range">
                    📊 Normal Range
                </label>

                <input
                    type="text"
                    id="normal_range"
                    name="normal_range"
                    placeholder="Enter normal/reference range"
                    required
                >

            </div>


            <div class="form-group">

                <label for="impression">
                    📝 Impression / Remarks
                </label>

                <textarea
                    id="impression"
                    name="impression"
                    rows="3"
                    placeholder="Enter impression or remarks"
                    required
                ></textarea>

            </div>


            <button type="submit" class="submit-btn">
                ✅ Submit Blood Test Report
            </button>

        </form>

    </div>

</div>

</body>

</html>
