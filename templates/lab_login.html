<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lab Technician Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/lab_login.css') }}">

</head>

<body>

    <div class="container">

        <div class="login-box">

            <div class="icon">
                🧪
            </div>

            <h1>Lab Technician Login</h1>

            <p class="subtitle">
                Healthcare Clinical Laboratory
            </p>

            <form action="/lab-login" method="POST">

                <div class="form-group">

                    <label>
                        📧 Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        placeholder="Enter laboratory email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        🔒 Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <button type="submit">
                    Login as Lab Technician
                </button>

            </form>


            <a href="/login" class="back-link">
                ← Back to Login
            </a>

        </div>

    </div>

</body>

</html>
