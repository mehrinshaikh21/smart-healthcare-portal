<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/admin_login.css') }}">

</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <div class="icon">
                🛡️
            </div>

            <h1>Admin Login</h1>

            <p class="subtitle">
                Smart Healthcare Portal
            </p>


            <form action="/admin-login" method="POST">

                <div class="form-group">

                    <label for="email">
                        📧 Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter admin email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        🔒 Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter admin password"
                        required
                    >

                </div>


                <button type="submit">
                    Login as Admin
                </button>

            </form>


            <a href="/login" class="back-link">
                ← Back to Login
            </a>

        </div>

    </div>

</body>

</html>
